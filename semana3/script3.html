<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Uso de JavaScript</h1>
    <script>
        // Funcion para sumar 2 números
        function sumar(num1, num2){
            return(num1 + num2)
        }

        // Llamada a la funcion sumar
        for(i = 2, j = 3; i != 10 ; i++, j+=2)
            document.write("<br>La suma de " + i + " + " + j + " = " + sumar(i,j))
    </script>
</body>
</html>
