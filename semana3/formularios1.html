<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Uso de Formularios</h1>
    <form action="" method="post">
        DNI <input type="text" name="txtdni" id="txtdni" />

        <br> FECHA REGISTRO <input type="date" name="txtfing" id="txtfing" />
        <br> COMENTARIOS <textarea name="txtcom" id="txtcom" cols="30" rows="10"></textarea>
        <br><input type="reset" value="Limpiar"><input type="submit" value="Enviar">
        

    </form>
