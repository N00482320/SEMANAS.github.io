<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Uso de JavaScript</h1>
    <script>
        // Funcion para calcular el mayor valor de 2 números        
        function mayor(num1, num2){
            return num1 > num2 ? num1 : num2
        }

        // Bloque de llamada
        let numero1 = 20
        let numero2 = 70
        let mayorValor = mayor(numero1, numero2)
        alert("El mayor valor es:" + mayorValor)
    </script>
</body>
</html>
